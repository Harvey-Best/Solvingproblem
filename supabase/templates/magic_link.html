<!--
  Paste into Supabase → Authentication → Emails → "Magic Link" (and "Confirm signup").
  Subject: Your Home Doctor sign-in link

  The link goes straight to our /auth/callback with a token_hash, so it works even
  when the email opens in a different browser than the one that asked for it.
  {{ .RedirectTo }} already carries ?next=..., hence the "&".
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2 style="margin: 0 0 12px;">Sign in to Home Doctor</h2>
  <p style="margin: 0 0 20px; line-height: 1.5;">Tap the button to sign in. The link works once and expires in an hour.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #0f766e; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 10px; font-weight: 600;">
      Sign in to Home Doctor
    </a>
  </p>
  <p style="margin: 0 0 8px; line-height: 1.5;">Or enter this code in the app:</p>
  <p style="margin: 0 0 24px; font-size: 28px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
  <p style="margin: 0; font-size: 12px; color: #6b7280;">If you didn't ask to sign in, you can ignore this email.</p>
</div>
